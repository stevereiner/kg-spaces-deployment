# This deployment's settings on top of Flexible GraphRAG's docker/includes/app-stack.yaml (merged by
# compose.flexible-graphrag.yaml; paths are relative to the deployment folder). app-stack.yaml itself stays as
# released.
#
# - Published images instead of builds from a checkout (FLEXIBLE_GRAPHRAG_VERSION), or images of your own:
#   FLEXIBLE_GRAPHRAG_BACKEND_IMAGE and FLEXIBLE_GRAPHRAG_UI_*_IMAGE (scripts/build-flexible-graphrag.sh builds them
#   from a checkout).
# - The backend's settings: flexible-graphrag.env (FLEXIBLE_GRAPHRAG_ENV_FILE: LLM, embeddings, keys, which
#   databases), then flexible-graphrag/docker/.env (the databases' addresses inside this deployment), then the
#   repository, OpenArch and state store addresses below.
# - Project-named containers (kg-spaces-...), so a Flexible GraphRAG dev stack's containers can exist alongside.
# - The UIs on their own ports too: their nginx serves /api from the backend.

services:

  flexible-graphrag-backend:
    build: !reset null
    image: ${FLEXIBLE_GRAPHRAG_BACKEND_IMAGE:-integratedsemantics/flexible-graphrag-backend:${FLEXIBLE_GRAPHRAG_VERSION:-0.9.0}}
    container_name: !reset null
    env_file: !override
      - path: ${FLEXIBLE_GRAPHRAG_ENV_FILE:-./flexible-graphrag.env}
        required: true
      - path: ./flexible-graphrag/docker/.env
        required: true
    environment:
      ENABLE_INCREMENTAL_UPDATES: "true"
      # data source configs and document state: postgres (postgres-pgvector, POSTGRES_INCREMENTAL_URL in
      # docker/.env) or openarch (the OpenArch tree; needs a backend image from 0.9.0 on)
      INCREMENTAL_STATE_STORE: ${INCREMENTAL_STATE_STORE:-postgres}
      OPENARCH_URL: http://openarch:8080
      # Alfresco through the proxy, and ActiveMQ's STOMP on its published port: up to 0.8.x the backend reaches
      # STOMP on the host of each Alfresco data source's URL; from 0.9.0 ALFRESCO_STOMP_HOST says where
      ALFRESCO_URL: http://host.docker.internal:${PROXY_PORT:-8080}
      # the default CMIS address (a CMIS ingest without a url): Alfresco's CMIS through the proxy
      CMIS_URL: http://host.docker.internal:${PROXY_PORT:-8080}/alfresco/api/-default-/public/cmis/versions/1.1/atom
      ALFRESCO_STOMP_HOST: host.docker.internal
      ALFRESCO_STOMP_PORT: ${ACTIVEMQ_STOMP_PORT:-8613}
      # where the BROWSER opens Alfresco documents (answers' and results' links): ACA through the proxy (ALFRESCO_URL
      # above is the backend's own address, which a browser can't reach)
      ALFRESCO_ACA_URL: http://${KG_SPACES_HOST:-localhost}:${PROXY_PORT:-8080}/content-app
      NUXEO_URL: http://nuxeo:8080/nuxeo
      # where the BROWSER opens Nuxeo documents (answers' and results' links): Web UI through the proxy, on the same
      # address as KG Spaces for Nuxeo (NUXEO_URL above is the backend's own address; from 0.9.0)
      NUXEO_WEBUI_URL: http://${KG_SPACES_HOST:-localhost}:${PROXY_PORT:-8080}/nuxeo/ui
      NUXEO_KAFKA_BOOTSTRAP_SERVERS: nuxeo-kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !override
      - "${BACKEND_PORT:-8000}:8000"
    volumes: !override
      - upload_data:/app/uploads
      - ./flexible-graphrag/schemas:/app/schemas:ro
      - ./flexible-graphrag/flows:/app/flows:ro
    depends_on:
      postgres-pgvector:            # when the menu has it (the default state store's database)
        condition: service_started
        required: false
      openarch:
        condition: service_healthy

  flexible-graphrag-ui-angular:
    build: !reset null
    image: ${FLEXIBLE_GRAPHRAG_UI_ANGULAR_IMAGE:-integratedsemantics/flexible-graphrag-ui-angular:${FLEXIBLE_GRAPHRAG_VERSION:-0.9.0}}
    container_name: !reset null
    ports: !override
      - "${FG_ANGULAR_PORT:-4200}:4200"
    volumes:
      - ./flexible-graphrag/ui-angular.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:   # the image's checks localhost, which resolves to IPv6; nginx listens on IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  flexible-graphrag-ui-react:
    build: !reset null
    image: ${FLEXIBLE_GRAPHRAG_UI_REACT_IMAGE:-integratedsemantics/flexible-graphrag-ui-react:${FLEXIBLE_GRAPHRAG_VERSION:-0.9.0}}
    container_name: !reset null
    ports: !override
      - "${FG_REACT_PORT:-3000}:3000"
    volumes:
      - ./flexible-graphrag/ui-react.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  flexible-graphrag-ui-vue:
    build: !reset null
    image: ${FLEXIBLE_GRAPHRAG_UI_VUE_IMAGE:-integratedsemantics/flexible-graphrag-ui-vue:${FLEXIBLE_GRAPHRAG_VERSION:-0.9.0}}
    container_name: !reset null
    ports: !override
      - "${FG_VUE_PORT:-5173}:5173"
    volumes:
      - ./flexible-graphrag/ui-vue.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
