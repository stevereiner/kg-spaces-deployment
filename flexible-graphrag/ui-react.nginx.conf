# flexible-graphrag-ui-react's own nginx.conf (flexible-graphrag-ui/frontend-react/nginx.conf, 0.8.4), plus /api
# to the backend (compose.flexible-graphrag.yaml).
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Static asset caching (hashed filenames from Vite build)
    location ~* /ui/react/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — serve index.html for all routes under /ui/react/
    location /ui/react/ {
        try_files $uri $uri/ /ui/react/index.html;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect bare root to the UI
    location = / {
        return 301 /ui/react/;
    }

    # the backend, for the UI on its own port (through the deployment's proxy /api goes there directly)
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://flexible-graphrag-backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }
}
