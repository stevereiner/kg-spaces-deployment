# The entry point (nginx): Alfresco (/alfresco, /share), Nuxeo (/nuxeo), the Flexible GraphRAG backend (/api, and
# /fg-api) and UIs (/ui/..., and /fg-react, /fg-vue, /fg-angular), KG Spaces ACA (/kg-spaces-aca), KG Spaces for
# Nuxeo (/kg-spaces-nuxeo). Included by compose.yaml; not a stack by itself.
#
# The deployment's own paths are settings (.env): KG_SPACES_ACA_PATH, KG_SPACES_NUXEO_PATH, FG_REACT_PATH, FG_VUE_PATH, FG_ANGULAR_PATH,
# FG_API_PATH, each a path without a trailing slash. proxy/nginx.conf.template is filled in with them when the proxy
# starts (the nginx image's templates step); only those variables are replaced, never nginx's own $variables.

services:

  proxy:
    image: nginx:${NGINX_VERSION:-stable-alpine}
    extra_hosts:   # a backend on the host (FG_BACKEND_URL=http://host.docker.internal:8000)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./proxy/index.html:/usr/share/nginx/html/index.html:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx          # the template becomes /etc/nginx/nginx.conf
      NGINX_ENVSUBST_FILTER: "^(FG_BACKEND_URL|ALFRESCO_SERVER_URL|NUXEO_SERVER_URL|COMPOSE_PROFILES|KG_SPACES_ACA_PATH|KG_SPACES_NUXEO_PATH|FG_REACT_PATH|FG_VUE_PATH|FG_ANGULAR_PATH|FG_API_PATH)$$"
      # /alfresco/ and /nuxeo/: this deployment's repositories, or ones outside it
      ALFRESCO_SERVER_URL: ${ALFRESCO_SERVER_URL:-http://alfresco:8080}
      NUXEO_SERVER_URL: ${NUXEO_SERVER_URL:-http://nuxeo:8080}
      # which parts run, for the landing page
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      KG_SPACES_ACA_PATH: ${KG_SPACES_ACA_PATH:-/kg-spaces-aca}
      # the Flexible GraphRAG backend behind /api (and FG_API_PATH): the deployment's container, or one running
      # from a checkout on the host (http://host.docker.internal:8000) while developing
      FG_BACKEND_URL: ${FG_BACKEND_URL:-http://flexible-graphrag-backend:8000}
      KG_SPACES_NUXEO_PATH: ${KG_SPACES_NUXEO_PATH:-/kg-spaces-nuxeo}
      FG_REACT_PATH: ${FG_REACT_PATH:-/fg-react}
      FG_VUE_PATH: ${FG_VUE_PATH:-/fg-vue}
      FG_ANGULAR_PATH: ${FG_ANGULAR_PATH:-/fg-angular}
      FG_API_PATH: ${FG_API_PATH:-/fg-api}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
